name: Automated Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backup_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d backup_demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Create test data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d backup_demo -c "CREATE TABLE IF NOT EXISTS test_data (id SERIAL PRIMARY KEY, name TEXT);"
          psql -h localhost -U postgres -d backup_demo -c "INSERT INTO test_data (name) VALUES ('Backup Test'), ('Restore Test'), ('GitHub Actions Test');"

      - name: Create database backup
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p backups
          pg_dump -h localhost -U postgres -d backup_demo -F c -f backups/backup_demo.dump

      - name: Verify backup file
        run: |
          ls -lh backups/backup_demo.dump
          test -s backups/backup_demo.dump

      - name: Restore backup to test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS restore_test;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE restore_test;"
          pg_restore -h localhost -U postgres -U postgres -d restore_test --clean --if-exists backups/backup_demo.dump

      - name: Verify restored database
        env:
          PGPASSWORD: postgres
        run: |
          COUNT=$(psql -h localhost -U postgres -d restore_test -tAc "SELECT COUNT(*) FROM test_data;")
          echo "Restored record count: $COUNT"
          test "$COUNT" -eq 3

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backups/backup_demo.dump
